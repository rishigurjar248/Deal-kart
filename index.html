<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =========================
       FAVICON
  ========================== -->

    <link rel="icon" type="image/png" href="/src/assets/dealkart-logo.png" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/src/assets/dealkart-symbol.png"
    />
    <link rel="apple-touch-icon" href="/src/assets/dealkart-logo.png" />

    <!-- =========================
       PRIMARY SEO
  ========================== -->

    <title>
      DealKart – Best Deals, Lowest Prices & Online Shopping in India
    </title>

    <meta
      name="description"
      content="Shop the best deals in India on DealKart. Discover affordable electronics, lifestyle, home, beauty and trending products with exclusive discounts and great prices."
    />

    <meta
      name="keywords"
      content="DealKart, Deal-Kart, DealKart India, online shopping India, best deals India, best offers India, cheap products online India, discounted products India, lowest price products, online deals India, affordable shopping India, electronics deals India, lifestyle deals India, home products India, trending products India"
    />

    <meta name="author" content="DealKart" />
    <meta name="publisher" content="DealKart" />
    <meta name="application-name" content="DealKart" />

    <!-- =========================
       SEARCH ENGINE
  ========================== -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =========================
       CANONICAL URL
  ========================== -->

    <link rel="canonical" href="https://deal-kart.co.in/" />

    <!-- =========================
       INDIA GEO / LANGUAGE
  ========================== -->

    <meta name="geo.region" content="IN" />
    <meta name="geo.country" content="India" />
    <meta name="country" content="India" />
    <meta name="content-language" content="en-IN" />

    <link rel="alternate" hreflang="en-IN" href="https://deal-kart.co.in/" />

    <link
      rel="alternate"
      hreflang="x-default"
      href="https://deal-kart.co.in/"
    />

    <!-- =========================
       THEME
  ========================== -->

    <meta name="theme-color" content="#090909" />
    <meta name="format-detection" content="telephone=no" />

    <!-- =========================
       OPEN GRAPH
  ========================== -->

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="DealKart – Best Deals & Lowest Prices in India"
    />

    <meta
      property="og:description"
      content="Discover amazing products, exclusive deals and affordable prices on DealKart. Shop smarter and save bigger across India."
    />

    <meta property="og:url" content="https://deal-kart.co.in/" />

    <meta property="og:site_name" content="DealKart" />

    <meta property="og:locale" content="en_IN" />

    <meta property="og:image" content="https://deal-kart.co.in/logo.png" />

    <meta
      property="og:image:alt"
      content="DealKart – Best Deals and Online Shopping in India"
    />

    <meta property="og:image:type" content="image/png" />

    <!-- =========================
       TWITTER / X
  ========================== -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="DealKart – Best Deals & Lowest Prices in India"
    />

    <meta
      name="twitter:description"
      content="Shop amazing products at affordable prices with exclusive deals on DealKart."
    />

    <meta name="twitter:image" content="https://deal-kart.co.in/logo.png" />

    <meta
      name="twitter:image:alt"
      content="DealKart – Online Shopping & Best Deals"
    />

    <!-- =========================
       ADDITIONAL METADATA
  ========================== -->

    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <meta name="language" content="English" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
